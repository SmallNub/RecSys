# @package _global_
# MARIUS config for small datasets (~10k items: Video Games, Beauty)
# Structurally stabilized via Gradient Isolation and Logit Denormalization Protection

task_name: MARIUS_fusion

# Runtime configuration overrides injected into train.yaml
trainer:
  max_steps: 20_000
  val_check_interval: 2_000

model:
  net:
    _target_: src.models.marius_fusion.MARIUS
    
    # LOSS & REGULARIZATION CALIBRATION
    contrastive_weight: 0.3        # Safely set high; gradients are isolated from the generator
    entropy_weight: 0.0             
    contrastive_temperature: 0.07
    label_smoothing: 0.0           # RESEARCH FIX: Standardized next-token choice probability distribution

    temporal_cfg:
      _target_: src.models.marius_fusion.TransformerConfig
      seq_len: ${data.datasets.prepro_cfg.crop_length}
      vocab_size: 1026 
      n_layers: 2
      d_head: 64
      d_model: 256
      dropout: 0.3                  
      emb_dropout: 0.1              
    depth_cfg:
      _target_: src.models.marius_fusion.TransformerConfig
      vocab_size: ${model.net.temporal_cfg.vocab_size}
      seq_len: 4
      n_layers: 2
      d_head: 64
      d_model: ${model.net.temporal_cfg.d_model}
      dropout: 0.1
      emb_dropout: 0.1              
    cosette:
      _target_: src.models.cosette_wrapper.CosetteWrapper
      model_path: ???
    filter_preds: true 
  mode: "generative"
  
  # OPTIMIZER SETTINGS
  optimizer: 
    lr: 0.0005
    weight_decay: 0.01              # Stabilized parameter norms across short-term training spans
  scheduler: 
    warmup_steps: 1000              
    
data: 
  datasets:
    emb_id: sentence-t5-xl
    quant_id: COSETTE_128d_256x4_71e4col
    prepro_cfg: 
      _cls_: src.data.marius.MARIUSPrePro
