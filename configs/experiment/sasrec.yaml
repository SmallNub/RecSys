# @package _global_

task_name: SASRec

model:
  net: 
    _target_: src.models.sasrec.SASRec
    vocab_size: 3_000_000 # Should be overriden at instantiation
    n_layers: 2
    d_head: 4
    d_model: 32
    dropout: 0.4
    emb_dropout: 0.4
    seq_len: ${data.datasets.prepro_cfg.crop_length}
    filter_preds: true # Better evaluation of "true" validation metrics, but slower
    normalization: null
    criterion:
      _target_: src.models.sasrec.SampledSoftmax
      temperature: 0.05
      n_items: 30000
  mode: "dense"
  optimizer: 
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0005
    weight_decay: 0.0
  scheduler: 
    warmup_steps: 2000

data: 
  datasets: 
    emb_id: null
    quant_id: null
    prepro_cfg: 
      _cls_: src.data.sasrec.SASRecPrePro
