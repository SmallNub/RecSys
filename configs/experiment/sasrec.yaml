# @package _global_

task_name: SASRec

model:
  net: 
    _target_: src.models.sasrec.SASRec
    vocab_size: 3_000_000 # Should be overriden at instantiation
    n_layers: 2
    d_head: 64
    d_model: 512
    dropout: 0.5
    emb_dropout: 0.5
    seq_len: ${data.datasets.prepro_cfg.crop_length}
    filter_preds: true # Better evaluation of "true" validation metrics, but slower
    normalization: l2
    criterion:
      _target_: src.models.sasrec.SampledSoftmax
      temperature: 0.05
      n_items: 30000
  mode: "discriminative"
  optimizer: 
    lr: 0.001
    weight_decay: 0.0001
  scheduler: 
    warmup_steps: 2000

data: 
  datasets: 
    emb_id: null
    quant_id: null
    prepro_cfg: 
      _cls_: src.data.sasrec.SASRecPrePro
