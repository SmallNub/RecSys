# @package _global_

task_name: SASRec

model:
  net: 
    _target_: src.models.sasrec.SASRec
    n_layers: 2
    d_model: 128
    d_head: 64
    vocab_size: 89959
    dropout: 0.4
    seq_len: ${data.ray_datasets.prepro_cfg.crop_length}
    normalization: l2
    criterion:
      _target_: src.models.sasrec.SampledSoftmax
      temperature: 0.05
      n_items: 30000
  mode: "dense"
  optimizer: 
    lr: 0.0005
    weight_decay: 0. 
  scheduler: 
    warmup_steps: 2000


data: 
  ray_datasets: 
    emb_id: null
    quant_id: null # No quantization for SASRec
    prepro_cfg: 
      _cls_: src.data.sasrec.SASRecPrePro
