# @package _global_
# MARIUS config for small datasets (~10k items: Video Games, Beauty)
# Optimized for a stable 20k step lifecycle with global trainer overrides

task_name: MARIUS_fusion

# OPTIMIZED: Injecting trainer overrides directly into the experiment file
trainer:
  max_steps: 20_000
  val_check_interval: 2_000

model:
  net:
    _target_: src.models.marius_fusion.MARIUS
    
    # HYPERPARAMETER OPTIMIZATION: Loss Balance Calibration
    contrastive_weight: 0.15        # Lowered to keep cross-entropy generation dominant
    entropy_weight: 0.001           
    contrastive_temperature: 0.07

    temporal_cfg:
      _target_: src.models.marius_fusion.TransformerConfig
      seq_len: ${data.datasets.prepro_cfg.crop_length}
      vocab_size: 1026 
      n_layers: 2
      d_head: 64
      d_model: 256
      dropout: 0.3                  # Slightly optimized down to reduce underfitting in short runs
      emb_dropout: 0.1              # OPTIMIZED: Added to stabilize initial token space embedding
    depth_cfg:
      _target_: src.models.marius_fusion.TransformerConfig
      vocab_size: ${model.net.temporal_cfg.vocab_size}
      seq_len: 4
      n_layers: 2
      d_head: 64
      d_model: ${model.net.temporal_cfg.d_model}
      dropout: 0.1
      emb_dropout: 0.1              # OPTIMIZED: Added to protect fine-grained depth progression
    cosette:
      _target_: src.models.cosette_wrapper.CosetteWrapper
      model_path: ???
    filter_preds: true 
  mode: "generative"
  
  # HYPERPARAMETER OPTIMIZATION: Optimizer Stability
  optimizer: 
    lr: 0.0005
    weight_decay: 0.01              # OPTIMIZED: Raised from 0.0001 to prevent parameter explosion
  scheduler: 
    warmup_steps: 1000              # OPTIMIZED: Positioned at exactly 5% of total max_steps
    
data: 
  datasets:
    emb_id: sentence-t5-xl
    quant_id: COSETTE_128d_256x4_71e4col
    prepro_cfg: 
      _cls_: src.data.marius.MARIUSPrePro
