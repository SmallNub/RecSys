# @package paths

protocol: file
# Base folder — resolves to <project_root>/datasets/ wherever the script is run from
root: ${oc.env:PWD}/datasets
# Folder where Amazon-Reviews-2023 was downloaded via HuggingFace
hf_data_folder: ${.root}/amazon-2023
# Folder where Amazon-Reviews-2014 raw files live (Beauty_5.json, meta_Beauty.json, ...)
hf_data_folder_2014: ${.root}/amazon-2014
# Set to true to skip downloading (data already present in hf_data_folder)
skip_download: false
# Raw ratings and IDs
timelines_tplt: ${.root}/data/timelines/{category}.{split}.parquet
# Raw metadata
meta_tplt: ${.root}/data/meta/{category}.parquet
# Unique items
unique_items_tplt: ${.root}/data/timelines/{category}_items.pkl
# Embeddings
embeddings_tplt: ${.root}/data/embeddings/{emb_method}/{category}/embeddings.parquet
# Semantic IDs
semantic_ids_tplt: ${.root}/data/embeddings/{emb_method}/{category}/{quant_method}.parquet
semantic_model_tplt: ${.root}/data/embeddings/{emb_method}/{category}/{quant_method}_model.pkl
# Model outputs
model_folder_tplt: ${oc.env:PWD}/outputs/checkpoints/marius
# Logging project
wandb_project_name: RecSys
wandb_entity: smallnub-university-of-amsterdam
wandb_mode: online